<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WORD BLAST</title>
  <!-- Critical inline styles (Fix: unstyled "Rotate Your Phone" white page).
       These mirror css/style.css for the page shell + orientation overlay and
       are intentionally inlined so a failed/404 external stylesheet can NEVER
       leave a raw, unstyled overlay visible. The full stylesheet layers the
       refinements on top when it loads. -->
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #081c15; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    #game { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; box-sizing: border-box;
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #rotate-overlay {
      position: fixed; inset: 0; z-index: 1000; display: none;
      align-items: center; justify-content: center; box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: rgba(8, 28, 21, 0.97); color: #ffd60a;
      font-family: Arial, Helvetica, sans-serif; text-align: center;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #rotate-overlay.is-visible { display: flex; }
    #rotate-overlay .rotate-card {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 24px; max-width: min(86vw, 420px);
    }
    #rotate-overlay h2 { margin: 0; font-size: clamp(22px, 6vw, 34px); letter-spacing: 0.02em; }
    #rotate-overlay p { margin: 0; color: #ffffff; font-size: clamp(14px, 4vw, 17px); line-height: 1.5; }
    #rotate-overlay .rotate-phone { transform-origin: 60px 66px; animation: wb-rotate-nudge 2.2s ease-in-out infinite; }
    @keyframes wb-rotate-nudge {
      0%, 55%, 100% { transform: rotate(0deg); }
      75%           { transform: rotate(-82deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #rotate-overlay .rotate-phone { animation: none; }
    }
  </style>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="game"></div>

  <!-- Landscape-only gate: fullscreen on phones held in portrait (Fix #2).
       Shown/hidden by js/systems/OrientationGate.js on every scene. -->
  <div id="rotate-overlay" role="dialog" aria-label="Rotate your phone" aria-hidden="true">
    <div class="rotate-card">
      <svg class="rotate-icon" viewBox="0 0 140 120" width="140" height="120" aria-hidden="true">
        <!-- rotating phone -->
        <g class="rotate-phone">
          <rect x="34" y="18" width="52" height="96" rx="10" fill="none" stroke="#ffd60a" stroke-width="6"/>
          <rect x="42" y="30" width="36" height="60" rx="4" fill="none" stroke="#ffd60a" stroke-width="3"/>
          <rect x="53" y="96" width="14" height="4" rx="2" fill="#ffd60a"/>
        </g>
        <!-- rotation arrow -->
        <path d="M 112 62 A 54 54 0 0 0 96 26" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        <polygon points="88,16 106,14 100,32" fill="#ffffff"/>
      </svg>
      <h2>Rotate Your Phone</h2>
      <p>WORD BLAST is played in landscape.<br />Turn your phone sideways to continue.</p>
    </div>
  </div>

  <noscript>
    <p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;margin:0;background:#081c15;color:#ffd60a;font-family:Arial,sans-serif;text-align:center;padding:24px;">
      WORD BLAST needs JavaScript enabled to run.
    </p>
  </noscript>

  <!-- Boot watchdog (Fix: Live Server blank screen). Dependency-free inline
       script so it survives any bundling/base-path problem and even a CSS 404:
       shows a loading chip, records module/resource errors and, if the Phaser
       canvas never appears, replaces the blank page with an actionable error
       card instead of an unexplained light-blue screen. js/main.js handshakes
       via window.__wbBoot.ok()/fail(). -->
  <script>
    (function () {
      var TIMEOUT_MS = 8000;
      var problems = [];
      var chip = null, card = null, timer = null, booted = false;

      function el(tag, style, text) {
        var n = document.createElement(tag);
        for (var k in style) n.style[k] = style[k];
        if (text) n.textContent = text;
        return n;
      }

      function showChip() {
        chip = el('div', {
          position: 'fixed', right: '10px', bottom: '10px', zIndex: '2147483000',
          padding: '6px 12px', borderRadius: '14px', background: 'rgba(8,28,21,.85)',
          color: '#ffd60a', font: '13px Arial, sans-serif', pointerEvents: 'none'
        }, 'Loading WORD BLAST\u2026');
        document.body.appendChild(chip);
      }

      function isUncompiledRoot() {
        return problems.some(function (p) {
          return /Failed to resolve module specifier|Relative references must start/.test(p);
        });
      }

      function showCard(reason) {
        if (booted || !document.body) return;
        if (chip && chip.parentNode) chip.parentNode.removeChild(chip);
        if (card && card.parentNode) card.parentNode.removeChild(card);

        card = el('div', {
          position: 'fixed', inset: '0', zIndex: '2147483001', boxSizing: 'border-box',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: 'rgba(8,28,21,.97)', padding: '24px',
          fontFamily: 'Arial, Helvetica, sans-serif', color: '#fff', overflow: 'auto'
        });
        var box = el('div', { maxWidth: '560px', width: '100%' });
        box.appendChild(el('h2', { margin: '0 0 8px', color: '#ffd60a', fontSize: '22px' }, 'WORD BLAST failed to start'));
        box.appendChild(el('p', { margin: '0 0 12px', lineHeight: '1.5', fontSize: '15px' }, reason));

        if (isUncompiledRoot()) {
          box.appendChild(el('p', { margin: '0 0 12px', lineHeight: '1.5', fontSize: '15px', color: '#ffd60a' },
            'Cause: the browser was served the UNCOMPILED project root instead of the compiled game. ' +
            'Run "npm run build" (or keep "npm run watch" running), make sure VS Code Live Server serves the ' +
            'dist/ folder (see .vscode/settings.json), then reload.'));
        } else {
          box.appendChild(el('p', { margin: '0 0 12px', lineHeight: '1.5', fontSize: '15px' },
            'Check the browser console (F12) and network tab for details, then reload the page.'));
        }

        if (problems.length) {
          var list = el('div', {
            margin: '0 0 12px', padding: '10px 12px', boxSizing: 'border-box',
            background: 'rgba(255,255,255,.08)', borderRadius: '8px',
            font: '12px/1.6 Consolas, monospace', color: '#ffb4a2', wordBreak: 'break-all'
          });
          problems.slice(0, 6).forEach(function (p) { list.appendChild(el('div', null, '\u2022 ' + p)); });
          box.appendChild(list);
        }
        card.appendChild(box);
        document.body.appendChild(card);
      }

      function record(msg) {
        if (problems.length < 12) problems.push(msg);
      }

      // Script/CSS/image/audio 404s fire 'error' on the element (no bubbling).
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK' ||
            t.tagName === 'IMG' || t.tagName === 'AUDIO')) {
          record('Failed to load ' + (t.src || t.href || t.tagName));
        } else if (e && e.message) {
          record(e.message + (e.filename ? '  (' + e.filename + (e.lineno ? ':' + e.lineno : '') + ')' : ''));
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        record('Unhandled promise rejection: ' + ((r && r.message) ? r.message : String(r)));
      });

      window.__wbBoot = {
        get booted() { return booted; },
        ok: function () {
          booted = true;
          if (timer) { clearTimeout(timer); timer = null; }
          if (chip && chip.parentNode) chip.parentNode.removeChild(chip);
          if (card && card.parentNode) card.parentNode.removeChild(card);
        },
        fail: function (reason) { showCard(String(reason || 'Unknown initialization error.')); }
      };

      function start() {
        showChip();
        timer = setTimeout(function () {
          if (booted) return;
          var canvas = document.querySelector('#game canvas');
          if (canvas) { window.__wbBoot.ok(); return; }
          showCard('The game did not finish initializing. Possible causes: missing or moved build output, ' +
            'a failed asset/module load, or a browser without WebGL support.');
        }, TIMEOUT_MS);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
      } else {
        start();
      }
    })();
  </script>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
